name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux also covers WSL2 (same userland). macOS + Windows verify
        # cross-platform behaviour of the numba engine, pyarrow and pathlib.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          environments: default

      - name: Install package (editable)
        run: pixi run pip install -e . --no-build-isolation

      - name: Lint (ruff)
        run: pixi run ruff check src tests

      - name: Format check (black)
        run: pixi run black --check src tests

      - name: Tests (pytest)
        run: pixi run pytest -q
