[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mhc-tp"
dynamic = ["version"]
description = "Cluster immunopeptidomics peptides by HLA/MHC binding motif, with an interactive HTML report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.12"
authors = [{ name = "Sanjay S G Krishna" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.60",
    "pyarrow>=15",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "logomaker>=0.8",
    "pillow>=10",
    "jinja2>=3.1",
    "rich>=13",
    "rich-argparse>=1.7",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
mhc-tp = "mhc_tp.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mhc_tp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavier tests (large reference / memory stress)"]
