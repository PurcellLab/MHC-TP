[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hla-pepclust"
version = "2.0.0-dev"
description = "Cluster immunopeptidomics peptides by HLA/MHC binding motif, with an interactive HTML report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.12"
authors = [{ name = "Sanjay S G Krishna" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.60",
    "pyarrow>=15",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "logomaker>=0.8",
    "pillow>=10",
    "jinja2>=3.1",
    "rich>=13",
    "rich-argparse>=1.7",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
clust-search = "hla_pepclust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hla_pepclust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavier tests (large reference / memory stress)"]
