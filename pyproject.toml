[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mhc-tp"
dynamic = ["version"]
description = "Cluster immunopeptidomics peptides by HLA/MHC binding motif, with an interactive HTML report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.12"
authors = [{ name = "Sanjay S G Krishna" }]
maintainers = [{ name = "Sanjay S G Krishna" }]
keywords = [
    "immunopeptidomics",
    "HLA",
    "MHC",
    "immunology",
    "mass-spectrometry",
    "bioinformatics",
    "gibbscluster",
    "peptide-clustering",
    "binding-motif",
    "epitope",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.60",
    "pyarrow>=15",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "logomaker>=0.8",
    "pillow>=10",
    "jinja2>=3.1",
    "rich>=13",
    "rich-argparse>=1.7",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
mhc-tp = "mhc_tp.cli:main"

[project.urls]
Homepage = "https://github.com/PurcellLab/MHC-TP"
Documentation = "https://purcelllab.github.io/MHC-TP/"
Repository = "https://github.com/PurcellLab/MHC-TP"
Issues = "https://github.com/PurcellLab/MHC-TP/issues"
Changelog = "https://github.com/PurcellLab/MHC-TP/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mhc_tp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavier tests (large reference / memory stress)"]
